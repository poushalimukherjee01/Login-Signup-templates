<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Template</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">
        <div class="login-box">
            <div class="header">
                <img src="assests02.png" alt="Logo" class="logo">
                <h2>Welcome Back!</h2>
                <p>Sign in to continue to My Business</p>
            </div>

            <form id="loginForm">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username" required>

                <label for="password">Password</label>
                <div class="password-field">
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <span class="toggle-password" id="togglePassword">⊘</span>
                </div>

                <div class="options">
                    <label>
                        <input type="checkbox" id="remember"> Keep me logged in
                    </label>
                    <a href="#" class="forgot">Forgot Password?</a>
                </div>

                <button type="submit" class="btn">Login</button>

                <p class="signup">Don’t have an account? <a href="#">Signup now</a></p>
            </form>

            <footer>© 2025 My Business</footer>
        </div>

        <div class="image-side">
            <img src="assets01.jpg" alt="Login Illustration">
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
